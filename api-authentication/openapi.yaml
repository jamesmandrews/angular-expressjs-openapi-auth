openapi: 3.0.3
info:
  title: Authentication API
  description: REST API with user authentication, registration, and password reset
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: auth
    description: Authentication and user management
  - name: org
    description: Organization management
  - name: admin
    description: Administrative operations
  - name: health
    description: Health check operations

paths:
  # ============================================
  # Authentication Endpoints
  # ============================================
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a new user account with email and password
      operationId: authRegister
      x-eov-operation-handler: auth/register
      x-rate-limit:
        max: 5
        windowMs: 900000  # 15 minutes - strict limit for registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_EXISTS
                  message: A user with this email address already exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - auth
      summary: Login user
      description: Authenticates a user and returns access and refresh tokens
      operationId: authLogin
      x-eov-operation-handler: auth/login
      x-rate-limit:
        max: 100
        windowMs: 900000  # 15 minutes - relaxed for development
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout user
      description: |
        Invalidates the current session by revoking the refresh token and optionally
        blacklisting the access token. Clears the refresh token cookie.
      operationId: authLogout
      x-eov-operation-handler: auth/logout
      x-allow-unverified-email: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout-all:
    post:
      tags:
        - auth
      summary: Logout from all devices
      description: |
        Revokes all refresh tokens for the user, effectively logging them out from all devices.
        Use this after a password change or when security concerns arise.
      operationId: authLogoutAll
      x-eov-operation-handler: auth/logoutAll
      x-allow-unverified-email: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out from all devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully logged out from all devices. 3 session(s) terminated.
                  data:
                    type: object
                    properties:
                      sessionsRevoked:
                        type: integer
                        description: Number of sessions that were terminated
                        example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      description: |
        Uses the HttpOnly refresh token cookie to obtain a new access token.
        The refresh token is automatically rotated on each use for security.
        Call this endpoint when the access token expires or on page load to restore session.
      operationId: authRefresh
      x-eov-operation-handler: auth/refresh
      # No security requirement - uses HttpOnly cookie instead of Bearer token
      responses:
        '200':
          description: Successfully refreshed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tokens:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_REFRESH_TOKEN
                  message: The refresh token is invalid or has expired
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: Request password reset
      description: Sends a password reset email to the user. Always returns success to prevent email enumeration.
      operationId: authForgotPassword
      x-eov-operation-handler: auth/forgotPassword
      x-rate-limit:
        max: 3
        windowMs: 3600000  # 1 hour - very strict for password reset requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If an account with that email exists, a password reset link has been sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many password reset requests. Please try again later.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/reset-password:
    post:
      tags:
        - auth
      summary: Reset password
      description: Resets the user's password using a valid reset token
      operationId: authResetPassword
      x-eov-operation-handler: auth/resetPassword
      x-rate-limit:
        max: 5
        windowMs: 900000  # 15 minutes - strict limit for password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password has been successfully reset
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_RESET_TOKEN
                  message: The password reset token is invalid or has expired
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags:
        - auth
      summary: Get current user
      description: Returns the profile of the currently authenticated user
      operationId: authMe
      x-eov-operation-handler: auth/me
      x-allow-unverified-email: true
      security:
        - bearerAuth:
            - profile:read
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - auth
      summary: Update current user profile
      description: Updates the profile of the currently authenticated user
      operationId: authUpdateProfile
      x-eov-operation-handler: auth/updateProfile
      security:
        - bearerAuth:
            - profile:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile updated successfully
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/change-password:
    post:
      tags:
        - auth
      summary: Change password
      description: Changes the password for the currently authenticated user. Requires current password for verification.
      operationId: authChangePassword
      x-eov-operation-handler: auth/changePassword
      security:
        - bearerAuth:
            - profile:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_PASSWORD
                  message: Current password is incorrect
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-email:
    post:
      tags:
        - auth
      summary: Verify email address
      description: Verifies the user's email address using the token sent via email
      operationId: authVerifyEmail
      x-eov-operation-handler: auth/verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_VERIFICATION_TOKEN
                  message: The verification token is invalid or has expired
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/resend-verification:
    post:
      tags:
        - auth
      summary: Resend verification email
      description: Sends a new verification email to the authenticated user
      operationId: authResendVerification
      x-eov-operation-handler: auth/resendVerification
      x-allow-unverified-email: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification email sent. Please check your inbox.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # Two-Factor Authentication (2FA) Endpoints
  # ============================================
  /auth/2fa/setup:
    post:
      tags:
        - auth
      summary: Initialize 2FA setup
      description: |
        Generates a TOTP secret and QR code for setting up two-factor authentication.
        The user should scan the QR code with their authenticator app, then verify
        with the /auth/2fa/verify-setup endpoint.
      operationId: auth2FASetup
      x-eov-operation-handler: auth/2fa/setup
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 2FA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Two-factor authentication setup initiated
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                        description: TOTP secret for manual entry
                        example: JBSWY3DPEHPK3PXP
                      otpAuthUri:
                        type: string
                        description: OTP auth URI for QR code generation
                        example: otpauth://totp/MyApp:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=MyApp
                      qrCode:
                        type: string
                        description: Base64-encoded QR code image (data URL)
                        example: data:image/png;base64,...
        '400':
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/2fa/verify-setup:
    post:
      tags:
        - auth
      summary: Verify and activate 2FA
      description: |
        Verifies the TOTP code to complete 2FA setup.
        Returns backup codes that should be stored securely.
      operationId: auth2FAVerifySetup
      x-eov-operation-handler: auth/2fa/verifySetup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  pattern: '^\d{6}$'
                  description: 6-digit TOTP code from authenticator app
                  example: '123456'
      responses:
        '200':
          description: 2FA enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Two-factor authentication has been enabled successfully
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        example: true
                      backupCodes:
                        type: array
                        items:
                          type: string
                        description: One-time use backup codes (shown only once)
                        example: ['ABC12345', 'DEF67890']
                      backupCodesWarning:
                        type: string
                        example: Store these backup codes in a safe place
        '400':
          description: Invalid code or 2FA not set up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/2fa/disable:
    post:
      tags:
        - auth
      summary: Disable 2FA
      description: |
        Disables two-factor authentication for the user.
        Requires password and current TOTP code (or backup code) for security.
      operationId: auth2FADisable
      x-eov-operation-handler: auth/2fa/disable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - code
              properties:
                password:
                  type: string
                  format: password
                  description: Current account password
                  example: SecurePass123
                code:
                  type: string
                  minLength: 6
                  maxLength: 8
                  description: TOTP code or backup code
                  example: '123456'
      responses:
        '200':
          description: 2FA disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Two-factor authentication has been disabled
        '400':
          description: Invalid code or 2FA not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/2fa/verify:
    post:
      tags:
        - auth
      summary: Verify 2FA code during login
      description: |
        Verifies the TOTP code or backup code during login flow.
        This endpoint is called after login returns a 2FA pending token.
        Returns a full access token upon successful verification.
      operationId: auth2FAVerify
      x-eov-operation-handler: auth/2fa/verify
      x-rate-limit:
        max: 5
        windowMs: 900000  # 15 minutes - strict limit for 2FA verification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 8
                  description: TOTP code from authenticator app or backup code
                  example: '123456'
      responses:
        '200':
          description: 2FA verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Two-factor authentication verified successfully
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/TokenResponse'
                      twoFactorVerified:
                        type: boolean
                        example: true
                      backupCodeUsed:
                        type: boolean
                        description: True if a backup code was used
                      remainingBackupCodes:
                        type: integer
                        description: Number of remaining backup codes (if backup code was used)
                      backupCodeWarning:
                        type: string
                        description: Warning if backup codes are running low
        '400':
          description: Invalid code or 2FA not required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/2fa/backup-codes:
    get:
      tags:
        - auth
      summary: Get backup codes status
      description: Returns the count of remaining unused backup codes
      operationId: auth2FABackupCodes
      x-eov-operation-handler: auth/2fa/backupCodes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Backup codes status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      remainingCodes:
                        type: integer
                        description: Number of remaining unused backup codes
                        example: 8
                      warning:
                        type: string
                        description: Warning if codes are running low
        '400':
          description: 2FA not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/2fa/backup-codes/regenerate:
    post:
      tags:
        - auth
      summary: Regenerate backup codes
      description: |
        Generates new backup codes, invalidating any existing ones.
        Requires current TOTP code for security.
      operationId: auth2FARegenerateBackupCodes
      x-eov-operation-handler: auth/2fa/regenerateBackupCodes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  pattern: '^\d{6}$'
                  description: Current TOTP code from authenticator app
                  example: '123456'
      responses:
        '200':
          description: New backup codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: New backup codes have been generated
                  data:
                    type: object
                    properties:
                      backupCodes:
                        type: array
                        items:
                          type: string
                        description: New one-time use backup codes
                        example: ['ABC12345', 'DEF67890']
                      warning:
                        type: string
                        example: Store these backup codes in a safe place
        '400':
          description: Invalid code or 2FA not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # Organization Endpoints
  # ============================================
  /org:
    get:
      tags:
        - org
      summary: Get current user's organization
      description: Returns the organization the current user belongs to, including members list
      operationId: orgGet
      x-eov-operation-handler: org/getOrg
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Organization ID
                      name:
                        type: string
                        description: Organization name
                      slug:
                        type: string
                        description: URL-friendly identifier
                      ownerId:
                        type: string
                        description: ID of the organization owner
                      role:
                        $ref: '#/components/schemas/OrganizationRole'
                      members:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationMember'
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User does not belong to an organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - org
      summary: Update organization
      description: Updates the current user's organization. Requires admin or owner role.
      operationId: orgUpdate
      x-eov-operation-handler: org/updateOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: New organization name
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Organization updated successfully
                  data:
                    $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions (requires admin or owner role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /org/invites:
    post:
      tags:
        - org
      summary: Create organization invite
      description: Invites a user to join the organization. Requires admin or owner role.
      operationId: orgInviteCreate
      x-eov-operation-handler: org/invites/create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to invite
                role:
                  type: string
                  enum: [admin, member]
                  description: Role to assign when invite is accepted
      responses:
        '201':
          description: Invitation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invitation sent successfully
                  data:
                    $ref: '#/components/schemas/OrganizationInvite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Invite already exists or user is already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - org
      summary: List pending invites
      description: Lists all pending invitations for the organization. Requires admin or owner role.
      operationId: orgInviteList
      x-eov-operation-handler: org/invites/list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of pending invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /org/invites/{id}:
    delete:
      tags:
        - org
      summary: Revoke invitation
      description: Revokes a pending invitation. Requires admin or owner role.
      operationId: orgInviteRevoke
      x-eov-operation-handler: org/invites/revoke
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Invite ID
          schema:
            type: string
            minLength: 22
            maxLength: 22
      responses:
        '200':
          description: Invitation revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invitation revoked successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /org/invites/accept:
    post:
      tags:
        - org
      summary: Accept invitation
      description: Accepts an invitation to join an organization. User must be authenticated and email must match invite.
      operationId: orgInviteAccept
      x-eov-operation-handler: org/invites/accept
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Invite token from email
      responses:
        '200':
          description: Successfully joined organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully joined the organization
                  data:
                    type: object
                    properties:
                      organizationId:
                        type: string
                      organizationName:
                        type: string
                      role:
                        $ref: '#/components/schemas/OrganizationRole'
        '400':
          description: Invalid or expired invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Email mismatch or already in organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already in an organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /org/members:
    get:
      tags:
        - org
      summary: List organization members
      description: Lists all members of the current user's organization
      operationId: orgMemberList
      x-eov-operation-handler: org/members/list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of organization members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /org/members/{userId}:
    patch:
      tags:
        - org
      summary: Update member role
      description: Updates a member's role. Owner can update any role, admin can only update members.
      operationId: orgMemberUpdate
      x-eov-operation-handler: org/members/update
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID of the member to update
          schema:
            type: string
            minLength: 22
            maxLength: 22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [admin, member]
                  description: New role for the member
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member role updated successfully
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      role:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - org
      summary: Remove member
      description: Removes a member from the organization. Owner can remove anyone, admin can only remove members.
      operationId: orgMemberRemove
      x-eov-operation-handler: org/members/remove
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID of the member to remove
          schema:
            type: string
            minLength: 22
            maxLength: 22
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /org/leave:
    post:
      tags:
        - org
      summary: Leave organization
      description: Allows current user to leave their organization. Owners cannot leave.
      operationId: orgLeave
      x-eov-operation-handler: org/leave
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully left organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You have left the organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User is not in an organization or is the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # Admin Endpoints
  # ============================================
  /admin/audit-logs:
    get:
      tags:
        - admin
      summary: Query audit logs
      description: |
        Retrieves audit logs with optional filtering. Requires admin role.
        Results are paginated and sorted by timestamp (newest first).
      operationId: adminGetAuditLogs
      x-eov-operation-handler: admin/auditLogs
      security:
        - bearerAuth:
            - admin:read
      parameters:
        - name: userId
          in: query
          description: Filter by user ID
          schema:
            type: string
            minLength: 22
            maxLength: 22
        - name: action
          in: query
          description: Filter by action type
          schema:
            type: string
            enum:
              - auth.login
              - auth.logout
              - auth.register
              - auth.password_reset_request
              - auth.password_reset
              - auth.password_change
              - auth.email_verified
              - auth.2fa_enabled
              - auth.2fa_disabled
              - auth.2fa_verify
              - auth.backup_code_used
              - user.profile_updated
              - user.role_assigned
              - user.role_removed
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum:
              - success
              - failure
              - blocked
        - name: startDate
          in: query
          description: Filter logs from this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter logs until this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of results (default 50, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of results to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # Health Check Endpoints
  # ============================================
  /health:
    get:
      tags:
        - health
      summary: Health check endpoint
      description: Returns server health status and basic metrics
      operationId: healthCheck
      x-eov-operation-handler: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: 2025-11-12T10:30:00Z
                  uptime:
                    type: number
                    description: Server uptime in seconds
                    example: 3600
                  environment:
                    type: string
                    example: development
                  memory:
                    type: object
                    properties:
                      used:
                        type: number
                        description: Memory used in MB
                      total:
                        type: number
                        description: Total memory in MB
                      unit:
                        type: string
                        example: MB

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

  schemas:
    # ============================================
    # Authentication Schemas
    # ============================================
    User:
      type: object
      required:
        - id
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 22
          maxLength: 22
          description: Unique identifier for the user (short ID)
          example: 2nSVxa5oKK6zABCD1234EF
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        firstName:
          type: string
          description: User's first name
          minLength: 1
          maxLength: 100
          example: John
        lastName:
          type: string
          description: User's last name
          minLength: 1
          maxLength: 100
          example: Doe
        emailVerified:
          type: boolean
          description: Whether the user's email has been verified
          default: false
          example: true
        roles:
          type: array
          items:
            type: string
          description: User's assigned roles
          example: ['user']
        scopes:
          type: array
          items:
            type: string
          description: User's effective scopes (derived from roles)
          example: ['profile:read', 'profile:write']
        organizationId:
          type: string
          minLength: 22
          maxLength: 22
          description: ID of the organization the user belongs to (if any)
          example: 3mTWyb6pLL7zBCDE2345FG
        organizationRole:
          $ref: '#/components/schemas/OrganizationRole'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user was created
          example: 2025-11-12T08:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user was last updated
          example: 2025-11-12T09:15:00Z

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          maxLength: 255
          example: user@example.com
        password:
          type: string
          format: password
          description: User's password (min 8 chars, must contain uppercase, lowercase, and number)
          minLength: 16
          maxLength: 128
          example: SecurePass123
        firstName:
          type: string
          description: User's first name
          minLength: 1
          maxLength: 100
          example: John
        lastName:
          type: string
          description: User's last name
          minLength: 1
          maxLength: 100
          example: Doe
        userType:
          type: string
          description: User type for registration (determines default role). Defaults to 'user' if not specified.
          maxLength: 50
          example: user
        organizationName:
          type: string
          description: Optional organization name. If provided and ORGANIZATIONS_ENABLED=true, creates a new organization with the user as owner.
          minLength: 2
          maxLength: 100
          example: Acme Corp

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          description: User's password
          example: SecurePass123

    # ============================================
    # Organization Schemas
    # ============================================
    OrganizationRole:
      type: string
      description: User's role within an organization
      enum:
        - owner
        - admin
        - member
      example: owner

    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - ownerId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 22
          maxLength: 22
          description: Unique identifier for the organization
          example: 3mTWyb6pLL7zBCDE2345FG
        name:
          type: string
          description: Organization name
          example: Acme Corp
        slug:
          type: string
          description: URL-friendly identifier
          example: acme-corp
        ownerId:
          type: string
          minLength: 22
          maxLength: 22
          description: ID of the organization owner
          example: 2nSVxa5oKK6zABCD1234EF
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the organization was created
          example: 2025-11-12T08:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the organization was last updated
          example: 2025-11-12T09:15:00Z

    OrganizationMember:
      type: object
      required:
        - userId
        - email
        - role
        - joinedAt
      properties:
        userId:
          type: string
          minLength: 22
          maxLength: 22
          description: User ID of the member
          example: 2nSVxa5oKK6zABCD1234EF
        email:
          type: string
          format: email
          description: Member's email address
          example: user@example.com
        firstName:
          type: string
          description: Member's first name
          example: John
        lastName:
          type: string
          description: Member's last name
          example: Doe
        role:
          $ref: '#/components/schemas/OrganizationRole'
        joinedAt:
          type: string
          format: date-time
          description: When the member joined the organization
          example: 2025-11-12T08:30:00Z

    OrganizationInvite:
      type: object
      required:
        - id
        - email
        - role
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          minLength: 22
          maxLength: 22
          description: Unique identifier for the invite
          example: 4nUXzc7qMM8zCDEF3456GH
        email:
          type: string
          format: email
          description: Email address of the invited user
          example: newuser@example.com
        role:
          type: string
          enum:
            - admin
            - member
          description: Role that will be assigned when invite is accepted
          example: member
        invitedBy:
          type: string
          minLength: 22
          maxLength: 22
          description: ID of the user who sent the invite
          example: 2nSVxa5oKK6zABCD1234EF
        expiresAt:
          type: string
          format: date-time
          description: When the invite expires
          example: 2025-11-19T08:30:00Z
        createdAt:
          type: string
          format: date-time
          description: When the invite was created
          example: 2025-11-12T08:30:00Z

    AuthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
            - tokens
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              $ref: '#/components/schemas/TokenResponse'

    TokenResponse:
      type: object
      required:
        - accessToken
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT access token for API authentication
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          description: Access token expiration time in seconds (configured via JWT_ACCESS_TOKEN_EXPIRY env var)
          example: 900
        tokenType:
          type: string
          description: Type of token
          default: Bearer
          example: Bearer

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address of the account to reset
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Password reset token received via email
          example: abc123def456...
        password:
          type: string
          format: password
          description: New password (min 8 chars, must contain uppercase, lowercase, and number)
          minLength: 16
          maxLength: 128
          example: NewSecurePass456

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Email verification token received via email
          example: abc123def456...

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          description: User's first name
          minLength: 1
          maxLength: 100
          example: John
        lastName:
          type: string
          description: User's last name
          minLength: 1
          maxLength: 100
          example: Doe

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: Current password for verification
          example: CurrentPass123
        newPassword:
          type: string
          format: password
          description: New password (min 8 chars, must contain uppercase, lowercase, and number)
          minLength: 16
          maxLength: 128
          example: NewSecurePass456

    # ============================================
    # Audit Log Schema
    # ============================================
    AuditLog:
      type: object
      required:
        - id
        - timestamp
        - action
        - status
        - createdAt
      properties:
        id:
          type: string
          minLength: 22
          maxLength: 22
          description: Unique identifier for the audit log entry
          example: 2nSVxa5oKK6zABCD1234EF
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
          example: 2025-12-08T10:30:00Z
        userId:
          type: string
          minLength: 22
          maxLength: 22
          nullable: true
          description: ID of the user who performed the action (null for unauthenticated actions)
          example: 2nSVxa5oKK6zABCD1234EF
        action:
          type: string
          description: The action that was performed
          enum:
            - auth.login
            - auth.logout
            - auth.register
            - auth.password_reset_request
            - auth.password_reset
            - auth.password_change
            - auth.email_verified
            - auth.2fa_enabled
            - auth.2fa_disabled
            - auth.2fa_verify
            - auth.backup_code_used
            - user.profile_updated
            - user.role_assigned
            - user.role_removed
          example: auth.login
        resourceType:
          type: string
          nullable: true
          description: Type of resource affected
          example: user
        resourceId:
          type: string
          nullable: true
          description: ID of the resource affected
          example: 2nSVxa5oKK6zABCD1234EF
        ipAddress:
          type: string
          nullable: true
          description: IP address of the client
          example: 192.168.1.1
        userAgent:
          type: string
          nullable: true
          description: User agent string from the client
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        status:
          type: string
          description: Result of the action
          enum:
            - success
            - failure
            - blocked
          example: success
        details:
          type: object
          nullable: true
          description: Additional event-specific details
          additionalProperties: true
          example:
            email: user@example.com
        createdAt:
          type: string
          format: date-time
          description: When the log entry was created
          example: 2025-12-08T10:30:00Z

    Pagination:
      type: object
      required:
        - total
        - limit
        - offset
        - hasMore
      properties:
        total:
          type: integer
          description: Total number of items matching the query
          example: 150
        limit:
          type: integer
          description: Maximum items per page
          example: 50
        offset:
          type: integer
          description: Number of items skipped
          example: 0
        hasMore:
          type: boolean
          description: Whether there are more items to fetch
          example: true

    # ============================================
    # Error Schema
    # ============================================
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              description: Human-readable error message
              example: The requested todo item could not be found
            details:
              type: array
              description: Additional error details
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Field that caused the error
                    example: title
                  message:
                    type: string
                    description: Detailed error message for the field
                    example: Title is required and cannot be empty

  responses:
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication is required to access this resource

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Insufficient permissions
              details:
                - field: scopes
                  message: "Missing required scopes: profile:write"

    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: The request could not be understood or was missing required parameters

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: The requested resource could not be found

    ValidationError:
      description: Validation error - invalid data provided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: One or more fields failed validation
              details:
                - field: email
                  message: Must be a valid email address
                - field: password
                  message: Password must be at least 8 characters

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred while processing your request
